name: esp_provisioning_softap
description: A Flutter plugin for provisioning ESP32 modules with SoftAP
version: 1.0.3
homepage: https://github.com/nicop2000/esp_provisioning_softap
publish_to: "none"

environment:
  sdk: ^3.7.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  protobuf: ^2.0.0
  cryptography: ^2.0.1
  logger: ^1.0.0
  string_validator: ^0.3.0
  http: ^1.1.0
  collection: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: de.petersen.nico.esp_provisioning_softap
        pluginClass: EspSoftapProvisioningPlugin
      ios:
        pluginClass: EspSoftapProvisioningPlugin
